name: Release Caddy Middleware

on:
  push:
    tags:
      - 'v*' # Trigger when a tag matching v* is pushed (e.g., v1.0.0)
  workflow_dispatch:  # Allow manual triggering from the GitHub UI

# Read-only by default; only create-release gets write access.
permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest # Base build platform for cross-compilation
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64 # Windows on arm64 is not common, remove it.
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26' # Use your desired go version

      - name: Install xcaddy
        # Pinned, same version as the Dockerfile and build-run-validate.yml.
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.7

      # Each archive holds a Caddy binary with caddy-waf compiled in. The
      # previous step ran `go build` on the module itself, which is a library:
      # the "binaries" it shipped were Go package archives that could not run.
      - name: Build Caddy with caddy-waf
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: .github/scripts/build-release.sh

      # The runner is linux/amd64, so that archive can be executed here: the
      # binary must start, load the WAF with the bundled rules.json, and report
      # the tag as its version on the metrics endpoint.
      - name: Smoke-test the linux/amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          tar -C "$dir" -xzf dist/caddy-waf_*_linux_amd64.tar.gz
          cd "$dir"/caddy-waf_*_linux_amd64
          ./caddy version
          ./caddy list-modules | grep -qx 'http.handlers.waf'
          cat > Caddyfile <<'CADDY'
          {
            auto_https off
            admin off
          }
          :18081 {
            route {
              waf {
                rule_file rules.json
                metrics_endpoint /waf_metrics
              }
              respond "ok" 200
            }
          }
          CADDY
          ./caddy run --config Caddyfile --adapter caddyfile > caddy.log 2>&1 &
          pid=$!
          for _ in $(seq 1 50); do curl -fsS -o /dev/null http://localhost:18081/ 2>/dev/null && break; sleep 0.2; done
          version=$(curl -fsS http://localhost:18081/waf_metrics | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          kill "$pid"
          echo "reported version: $version"
          if [ -n "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "error: binary reports $version, expected $TAG" >&2
            cat caddy.log >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: caddy-waf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  create-release:
    runs-on: ubuntu-latest
    needs: build-and-release # Ensure all builds complete before creating release
    permissions:
      contents: write
      id-token: write   # mint the provenance attestation
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Tag Name
        id: extract_tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8

      - name: Release via GH CLI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.extract_tag.outputs.TAG_NAME }}
        run: |
          # Flatten artifacts structure (download-artifact puts them in subdirs matches artifact name)
          # But we want all .tar.gz in current dir
          find . -name "*.tar.gz" -exec mv {} . \;
          sha256sum caddy-waf_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

          echo "Creating or updating release for $TAG_NAME..."
          # Try to create release with assets. If it fails (exists), upload assets.
          gh release create "$TAG_NAME" caddy-waf_*.tar.gz SHA256SUMS --title "$TAG_NAME" --generate-notes || \
          gh release upload "$TAG_NAME" caddy-waf_*.tar.gz SHA256SUMS --clobber

      # Software Bill of Materials for the release (SPDX), attached as an asset.
      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: caddy-waf-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.extract_tag.outputs.TAG_NAME }}
        run: gh release upload "$TAG_NAME" caddy-waf-sbom.spdx.json --clobber

      # SLSA build provenance for the release binaries.
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "caddy-waf_*.tar.gz"
