name: Test

on:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - main

permissions:
  contents: read # for actions/checkout to fetch code
  pull-requests: read # for golangci/golangci-lint-action to fetch pull requests

env:
  # https://github.com/actions/setup-go/issues/491
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      # Default is true, cancels jobs for other platforms in the matrix if one fails
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        go:
          - '1.25'

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: read
      actions: write # to allow uploading artifacts and cache
    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go }}
        check-latest: true

    - name: Get dependencies
      run: |
        go get -v

    - name: Run linter
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: latest
        args: --timeout 5m

    - name: Download MaxMindDB binary
      run: |
        wget https://github.com/P3TERX/GeoLite.mmdb/releases/latest/download/GeoLite2-Country.mmdb

    # The suite runs under the race detector: the middleware is concurrent
    # (atomic counters, a sync.Map of rule hits, a mutex-guarded metrics map,
    # file-watcher goroutines) and ships metrics_concurrency_test.go, so the gate
    # must exercise those under -race, not only functionally. -race requires cgo.
    - name: Run tests (race detector)
      env:
        CGO_ENABLED: "1"
      run: |
        go test -race -v -failfast ./... -tags=it

    - name: Run rule-translator unit tests
      run: |
        python3 -m unittest -v test_get_owasp_rules
