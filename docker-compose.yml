services:
  caddy-waf:
    # Pin an exact release rather than `latest`: this project has shipped
    # security fixes, and `latest` leaves no way to name the image you tested
    # against. Swap for `build: .` to run your local checkout instead -- since
    # v0.4.0 that actually compiles the working tree.
    image: ghcr.io/fabriziosalmi/caddy-waf:0.4.14
    # build: .
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/app/Caddyfile:ro
      - ./rules.json:/app/rules.json:ro
      # Not :ro -- the WAF watches these and reloads on change, so a host-side
      # updater needs to be able to rewrite them.
      - ./ip_blacklist.txt:/app/ip_blacklist.txt
      - ./dns_blacklist.txt:/app/dns_blacklist.txt
    restart: unless-stopped
    # Caddy's admin API (:2019) is unauthenticated and can reconfigure or stop the
    # server. It is left at Caddy's default localhost:2019 bind so it is not
    # reachable from other containers on this network. If you must expose it,
    # bind it to a dedicated internal address and put auth/mTLS in front.
    networks:
      - caddy-waf-net

networks:
  caddy-waf-net:
    driver: bridge
