<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="584" viewBox="0 0 1000 584" role="img" aria-labelledby="title desc">
<title id="title">How caddy-waf inspects a request</title>
<desc id="desc">caddy-waf runs inside Caddy. Phase 1 checks the client against an IP allowlist, IP and DNS blacklists, a rate limit and country and ASN lists, then runs rules on the URL and headers. Phase 2 runs rules on the request body. Matching rules add to an anomaly score; at the threshold, or on a rule with action block, the request is answered with 403 and never reaches the application. Phases 3 and 4 run rules on the response headers and body before the response returns to the client.</desc>
